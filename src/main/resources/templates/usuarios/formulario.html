<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layouts/main}">

    <div layout:fragment="content" class="container-fluid py-3 px-2 px-md-4">
        <style>
            :root {
                --input-border: #334155;
                --input-focus: #3b82f6;
                --card-bg: #1e293b;
            }

            .form-control-dark {
                background: #0f172a !important;
                border: 1px solid var(--input-border) !important;
                color: #f8fafc !important;
            }

            .form-control-dark:focus {
                border-color: var(--input-focus) !important;
                background: #0f172a !important;
                box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25) !important;
            }

            .card-custom {
                background: var(--card-bg) !important;
                border: 1px solid var(--input-border);
                border-radius: 16px;
            }

            /* MEJORA: Colores más brillantes para mejor lectura */
            .text-label-visible { color: #e2e8f0 !important; letter-spacing: 0.3px; }
            .text-helper-visible { color: #38bdf8 !important; font-size: 0.8rem; margin-top: 5px; display: block;}

            .form-select-dark {
                background-color: #0f172a !important;
                border: 1px solid var(--input-border) !important;
                color: white !important;
                background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important;
            }

            /* MEJORA PARA MÓVILES: Forzar el color de fondo y texto en las opciones desplegables */
            .form-select-dark option {
                background-color: #1e293b !important;
                color: #f8fafc !important;
            }

            /* AJUSTES RESPONSIVOS */
            @media (max-width: 767.98px) {
                .card-custom {
                    padding: 1.25rem !important; /* Menos padding en celulares para no robar espacio */
                }
                .mobile-full-btn {
                    width: 100% !important; /* Botones 100% de ancho en celulares */
                    margin-bottom: 0.5rem;
                }
            }
        </style>

        <div class="mb-4">
            <nav aria-label="breadcrumb" class="mb-2">
                <ol class="breadcrumb mb-0" style="font-size: 0.85rem;">
                    <li class="breadcrumb-item"><a th:href="@{/usuarios/mantenimiento}" class="text-primary fw-bold text-decoration-none">Usuarios</a></li>
                    <li class="breadcrumb-item active text-secondary" aria-current="page"
                        th:text="${usuario.idUsuario == null ? 'Nuevo' : 'Editar'}">Registro</li>
                </ol>
            </nav>
            <h4 class="fw-bold text-white mb-0 d-flex align-items-center">
                <i class="bi bi-person-gear me-2 text-primary fs-3"></i>
                <span th:text="${usuario.idUsuario == null ? 'Crear Nuevo Usuario' : 'Configurar Perfil'}"></span>
            </h4>
        </div>

        <div class="row g-4">
            <div class="col-12 col-lg-8 order-2 order-lg-1">
                <div class="card card-custom p-4 shadow-lg">
                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post" autocomplete="off">
                        <input type="hidden" th:field="*{idUsuario}" />
                        <input type="hidden" th:field="*{idEmpresa}" />
                        <input type="hidden" th:field="*{rol}" />

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label text-label-visible fw-bold small">Nombre Completo</label>
                                <input type="text" th:field="*{nombreCompleto}" class="form-control form-control-dark py-2" placeholder="Ej: Juan Pérez" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label text-label-visible fw-bold small">Nombre de Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                                    <input type="text" th:field="*{username}" class="form-control form-control-dark py-2" placeholder="usuario123" required>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label text-label-visible fw-bold small">Contraseña</label>
                                <div class="input-group">
                                    <input type="password" id="passInput" th:field="*{password}" class="form-control form-control-dark py-2"
                                           th:required="${usuario.idUsuario == null}">
                                    <button class="btn btn-dark border-secondary" type="button" onclick="togglePass()">
                                        <i id="passIcon" class="bi bi-eye text-info"></i>
                                    </button>
                                </div>
                                <span class="text-helper-visible">
                                    <i class="bi bi-info-circle me-1"></i>
                                    <span th:text="${usuario.idUsuario == null ? 'Obligatoria para usuarios nuevos.' : 'Dejar vacío para no cambiar la actual.'}"></span>
                                </span>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label text-label-visible fw-bold small">Asignar Sucursal</label>
                                <select th:field="*{sucursal.idSucursal}" class="form-select form-select-dark py-2" required>
                                    <option value="">-- Seleccionar Sede --</option>
                                    <option th:each="s : ${sucursales}"
                                            th:value="${s.idSucursal}"
                                            th:text="${s.nombre}"></option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6">
                                <label class="form-label text-label-visible fw-bold small">Rol de Sistema</label>
                                <select th:field="*{roleRelacional.idRole}" class="form-select form-select-dark py-2" required>
                                    <option value="">-- Seleccionar Acceso --</option>
                                    <option th:each="r : ${roles}"
                                            th:value="${r.idRole}"
                                            th:text="${r.nombreRol}"></option>
                                </select>
                            </div>

                            <div class="col-12 mt-4">
                                <div class="p-3 rounded-3 border border-secondary border-opacity-25" style="background: rgba(15, 23, 42, 0.4);">
                                    <div class="form-check form-switch d-flex align-items-center mb-0">
                                        <input class="form-check-input mt-0 me-3" type="checkbox" th:field="*{activo}" id="checkActivo" style="transform: scale(1.3);">
                                        <label class="form-check-label text-white fw-bold mb-0" for="checkActivo">Usuario Activo</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 mt-4 pt-2 border-top border-secondary border-opacity-25">
                                <div class="d-flex flex-column flex-md-row gap-2 justify-content-md-start">
                                    <button type="submit" class="btn btn-success px-5 py-2 fw-bold shadow-sm mobile-full-btn">
                                        <i class="bi bi-save me-2"></i>Guardar Usuario
                                    </button>
                                    <a th:href="@{/usuarios/mantenimiento}" class="btn btn-outline-light border-opacity-25 px-5 py-2 mobile-full-btn">
                                        <i class="bi bi-x-circle me-2"></i>Cancelar
                                    </a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-4 order-1 order-lg-2">
                <div class="p-4 rounded-4 shadow-sm" style="border: 1px solid #334155; background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.5) 100%);">
                    <h6 class="text-primary fw-bold mb-4 small text-uppercase"><i class="bi bi-info-square-fill me-2"></i>Información de Seguridad</h6>
                    <div class="d-flex flex-column gap-3">
                        <div class="d-flex gap-3 align-items-start">
                            <i class="bi bi-shield-lock text-success fs-4"></i>
                            <p class="text-label-visible small mb-0 lh-sm">La contraseña se <strong>encripta automáticamente</strong> (BCrypt) al guardar por seguridad de los datos.</p>
                        </div>
                        <hr class="border-secondary opacity-25 my-1">
                        <div class="d-flex gap-3 align-items-start">
                            <i class="bi bi-geo-alt-fill text-info fs-4"></i>
                            <p class="text-label-visible small mb-0 lh-sm">El usuario solo podrá visualizar y operar el inventario de la <strong>sucursal asignada</strong>.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            function togglePass() {
                const passInput = document.getElementById('passInput');
                const passIcon = document.getElementById('passIcon');
                if (passInput.type === 'password') {
                    passInput.type = 'text';
                    passIcon.classList.remove('bi-eye');
                    passIcon.classList.add('bi-eye-slash');
                } else {
                    passInput.type = 'password';
                    passIcon.classList.remove('bi-eye-slash');
                    passIcon.classList.add('bi-eye');
                }
            }
        </script>
    </th:block>
</th:block>
