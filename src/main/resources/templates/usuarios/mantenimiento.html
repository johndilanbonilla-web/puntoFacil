<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layouts/main}">

    <head>
        <style>
            /* Variables de color consistentes con el sistema */
            :root {
                --pf-primary: #3b82f6;
                --pf-success: #10b981;
                --pf-dark-bg: #0f172a;
                --pf-card-bg: #1e293b;
                --pf-border: #334155;
                --pf-text-main: #f8fafc;
            }

            /* Contenedor de tabla oscuro con bordes redondeados */
            .table-dark-custom {
                background: var(--pf-card-bg) !important;
                border: 1px solid var(--pf-border);
                border-radius: 12px;
                overflow: hidden;
            }

            .table-dark-custom table {
                background-color: transparent !important;
                margin-bottom: 0;
                border-collapse: separate;
                border-spacing: 0;
            }

            /* Encabezados con el azul de Punto Fácil */
            .table-dark-custom thead th {
                background-color: rgba(15, 23, 42, 0.9) !important;
                color: var(--pf-primary) !important;
                border-bottom: 2px solid var(--pf-border) !important;
                text-transform: uppercase;
                font-size: 0.75rem;
                letter-spacing: 0.05em;
                padding: 15px 20px;
            }

            /* Celdas con texto claro */
            .table-dark-custom td {
                background-color: var(--pf-card-bg) !important;
                color: var(--pf-text-main) !important;
                border-bottom: 1px solid var(--pf-border) !important;
                vertical-align: middle;
                padding: 12px 20px;
                transition: background 0.2s;
            }

            .table-hover tbody tr:hover td {
                background-color: #2d3a4f !important;
            }

            /* Estilo para los botones en modo oscuro */
            .btn-dark-mode {
                background: #0f172a;
                border: 1px solid var(--pf-border);
                color: var(--pf-text-main);
            }

            .btn-dark-mode:hover {
                background: #1e293b;
                color: var(--pf-primary);
            }
        </style>
    </head>

    <div layout:fragment="content">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h4 class="fw-bold mb-0 text-white">Gestión de Usuarios</h4>
                <p class="text-muted small mb-0">Control de acceso y perfiles de empleados.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/dashboard}" class="btn btn-sm btn-dark-mode px-3">
                    <i class="bi bi-arrow-left"></i> <span class="ms-1">Regresar</span>
                </a>
                <a th:href="@{/usuarios/nuevo}" class="btn btn-sm btn-success px-3 fw-bold shadow-sm">
                    <i class="bi bi-person-plus-fill me-1"></i> Nuevo Usuario
                </a>
            </div>
        </div>

        <div th:if="${success}" class="alert border-0 bg-success bg-opacity-10 text-success shadow-sm mb-4">
            <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${success}"></span>
        </div>

        <div class="table-dark-custom shadow-lg">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                    <tr>
                        <th class="ps-4">Usuario</th>
                        <th class="d-none d-md-table-cell">Username</th>
                        <th>Rol</th>
                        <th class="text-center">Estado</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td class="ps-4">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25"
                                     style="width: 38px; height: 38px; font-size: 0.85rem;"
                                     th:text="${#strings.substring(u.nombreCompleto,0,1)}">U</div>
                                <div>
                                    <div class="text-white fw-semibold" th:text="${u.nombreCompleto}">Nombre</div>
                                    <div class="d-md-none text-muted small" th:text="${u.username}">user</div>
                                </div>
                            </div>
                        </td>
                        <td class="d-none d-md-table-cell font-monospace small text-info opacity-75" th:text="${u.username}">username</td>
                        <td>
                            <span class="badge rounded-pill bg-dark border border-secondary border-opacity-50 text-info px-2 py-1"
                                  style="font-size: 0.7rem;" th:text="${u.rol}">ROL</span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-circle-fill" th:classappend="${u.activo ? 'text-success' : 'text-danger'}"
                                   style="font-size: 0.5rem;"></i>
                                <span class="d-none d-md-inline small opacity-75"
                                      th:text="${u.activo ? 'Activo' : 'Inactivo'}"></span>
                            </div>
                        </td>
                        <td class="text-center pe-4">
                            <a th:href="@{/usuarios/editar/{id}(id=${u.idUsuario})}"
                               class="btn btn-sm btn-dark-mode" title="Editar Usuario">
                                <i class="bi bi-pencil-square text-info"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="5" class="text-center py-5 text-muted small italic">
                            <i class="bi bi-people mb-2 d-block fs-2 opacity-25"></i>
                            No hay usuarios registrados en el sistema.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
