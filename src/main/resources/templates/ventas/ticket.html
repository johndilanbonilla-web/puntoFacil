<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket #[[${venta?.idVenta}]] - Punto Fácil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #1e293b; margin: 0; padding: 20px 10px; display: flex; flex-direction: column; align-items: center; }
        .ticket-wrapper { background-color: #ffffff !important; width: 280px; padding: 15px; color: #000 !important; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .bold { font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
        th { border-bottom: 2px dashed #000; text-align: left; padding-bottom: 5px; }
        td { padding: 5px 0; vertical-align: top; }
        .border-top { border-top: 2px dashed #000; padding-top: 8px; margin-top: 10px; }
        .total-container { font-size: 18px; margin-top: 5px; border-top: 2px solid #000; padding-top: 5px; }
        .no-print { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-print { background-color: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-family: sans-serif; font-weight: bold; }

        @media print {
            @page { margin: 0; size: 80mm auto; }
            body { background-color: #fff !important; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            .ticket-wrapper { width: 100%; box-shadow: none; padding: 10px; }
        }
    </style>
</head>
<body onload="if(window.self === window.top) window.print();">

<div class="no-print">
    <button class="btn-print" onclick="window.print()">
        <i class="bi bi-printer"></i> IMPRIMIR
    </button>
    <button class="btn-print" onclick="window.close()" style="background-color: #475569;">
        <i class="bi bi-x-circle"></i> CERRAR
    </button>
</div>

<div class="ticket-wrapper" th:if="${venta != null}">
    <div class="text-center">
        <h2 style="margin: 0; font-size: 20px;">PUNTO FÁCIL</h2>
        <p style="margin: 2px 0; font-size: 12px;">SUCURSAL CENTRO</p>
        <div class="border-top"></div>
        <p class="bold" style="margin: 5px 0;">TICKET: <span th:text="${venta.numeroDocumento}">000</span></p>
        <p style="font-size: 11px;" th:text="${venta.fechaVenta != null ? #temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm') : '---'}"></p>
    </div>

    <table>
        <thead>
        <tr>
            <th style="width: 15%;">CANT</th>
            <th style="width: 55%;">DESC</th>
            <th style="width: 30%; text-align: right;">TOTAL</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="detalle : ${venta.detalles}">
            <td th:text="${#numbers.formatDecimal(detalle.cantidad, 1, 0)}">1</td>
            <td style="text-transform: uppercase;">
                <span th:text="${detalle.producto != null ? detalle.producto.nombre : 'PRODUCTO'}"></span>
            </td>
            <td class="text-right" th:text="'$' + ${#numbers.formatDecimal(detalle.precioUnitario * detalle.cantidad, 1, 2)}"></td>
        </tr>
        </tbody>
    </table>

    <div class="border-top">
        <div class="text-right" style="font-size: 12px; margin-top: 5px;">
            <span>GRAVADO (SIN IVA):</span>
            <span th:text="'$' + ${#numbers.formatDecimal(venta.total / 1.13, 1, 2)}"></span>
        </div>

        <div class="text-right" style="font-size: 12px;">
            <span>IVA (13%):</span>
            <span th:text="'$' + ${#numbers.formatDecimal(venta.total - (venta.total / 1.13), 1, 2)}"></span>
        </div>

        <div class="text-right total-container">
            <span class="bold">TOTAL:</span>
            <span class="bold" style="font-size: 22px;" th:text="'$' + ${#numbers.formatDecimal(venta.total, 1, 2)}"></span>
        </div>
    </div>

    <div style="margin-top: 15px; font-size: 11px;" th:if="${venta.pagos != null and !venta.pagos.empty}">
        <div style="border-bottom: 1px solid #000; margin-bottom: 5px; font-weight: bold;">FORMA DE PAGO:</div>
        <div th:each="pago : ${venta.pagos}" style="display: flex; justify-content: space-between;">
            <span th:text="'PAGO REF.' + ${pago.idFormaPago}">PAGO:</span>
            <span th:text="'$' + ${#numbers.formatDecimal(pago.monto, 1, 2)}"></span>
        </div>
    </div>

    <div class="text-center" style="margin-top: 20px; border-top: 1px dashed #000; padding-top: 10px;">
        <p class="bold">*** ¡GRACIAS POR SU COMPRA! ***</p>
        <p style="font-size: 10px;">Atendido por: <span th:text="${venta.idUsuario}">1</span></p>
    </div>
</div>

<div th:if="${venta == null}" class="text-center" style="color: white; padding: 50px;">
    <h2><i class="bi bi-exclamation-triangle"></i> Error Grave</h2>
    <p>No se pudo recuperar la información de la venta.</p>
</div>

</body>
</html>
