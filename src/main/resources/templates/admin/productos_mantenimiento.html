<th:block xmlns:th="http://www.thymeleaf.org"
          xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
          layout:decorate="~{layouts/main}">

    <head>
        <title>Catálogo | PuntoFácil</title>
        <style>
            :root {
                --pf-primary: #10b981;
                --pf-primary-soft: rgba(16, 185, 129, 0.1);
                --pf-dark-bg: #0f172a;
                --pf-card-bg: #1e293b;
                --pf-border: #334155;
                --pf-text-main: #f8fafc;
                --pf-text-muted: #94a3b8;
                --pf-placeholder: #64748b;
            }

            #contenedor-dinamico { transition: opacity 0.2s ease-in-out; }
            .loading-state { opacity: 0.5; pointer-events: none; }

            .text-muted { color: var(--pf-text-muted) !important; }
            .form-control-dark::placeholder {
                color: var(--pf-placeholder) !important;
                font-size: 0.9rem;
                opacity: 1;
            }

            .table-dark-custom {
                background: var(--pf-card-bg);
                border: 1px solid var(--pf-border);
                border-radius: 16px;
                overflow: hidden;
            }

            .table-dark-custom thead th {
                background-color: rgba(15, 23, 42, 0.6) !important;
                color: var(--pf-primary) !important;
                border-bottom: 1px solid var(--pf-border) !important;
                text-transform: uppercase;
                font-size: 0.7rem;
                letter-spacing: 0.1em;
                padding: 1rem 1.25rem;
            }

            .table-dark-custom td {
                background-color: transparent !important;
                color: var(--pf-text-main) !important;
                border-bottom: 1px solid var(--pf-border) !important;
                padding: 0.85rem 1.25rem;
                vertical-align: middle;
            }

            .form-control-dark {
                background: var(--pf-dark-bg) !important;
                border: 1px solid var(--pf-border) !important;
                color: white !important;
            }

            .pagination-container {
                background: var(--pf-card-bg);
                border: 1px solid var(--pf-border);
                border-radius: 12px;
                padding: 0.75rem 1.25rem;
            }

            .page-link-custom {
                background: var(--pf-dark-bg);
                border: 1px solid var(--pf-border);
                color: var(--pf-text-muted);
                padding: 0.4rem 0.8rem;
                border-radius: 8px;
                text-decoration: none;
                font-size: 0.85rem;
                transition: all 0.2s;
                cursor: pointer;
            }

            .page-link-custom:hover:not(:disabled) { border-color: var(--pf-primary); color: var(--pf-primary); }
            .page-link-custom.active { background: var(--pf-primary); color: white; border-color: var(--pf-primary); }
            .page-link-custom:disabled { opacity: 0.4; cursor: not-allowed; }

            /* =========================================================
               MAGIA RESPONSIVA: TABLE TO CARDS (CATÁLOGO)
               ========================================================= */
            @media (max-width: 768px) {
                h4 { font-size: 1.2rem !important; }
                .pagination-container { flex-direction: column; gap: 10px; text-align: center; }

                .table-dark-custom { border: none !important; background: transparent !important; }
                .table-dark-custom table, .table-dark-custom tbody { display: block; width: 100%; }
                .table-dark-custom thead { display: none; }

                .table-dark-custom tr {
                    display: block;
                    background: var(--pf-card-bg) !important;
                    border: 1px solid var(--pf-border);
                    border-radius: 12px;
                    margin-bottom: 1.2rem;
                    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                }

                .table-dark-custom td {
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    padding: 12px 15px !important;
                    text-align: right;
                    border-bottom: 1px solid rgba(255,255,255,0.05) !important;
                }

                .table-dark-custom td:last-child { border-bottom: none !important; justify-content: flex-end; }

                .table-dark-custom td::before {
                    content: attr(data-label);
                    font-size: 0.7rem;
                    font-weight: bold;
                    color: #94a3b8;
                    text-transform: uppercase;
                    margin-right: 15px;
                }

                .table-dark-custom td:first-child {
                    justify-content: flex-start;
                    background: rgba(15, 23, 42, 0.4) !important;
                    border-radius: 12px 12px 0 0;
                    border-bottom: 1px solid var(--pf-border) !important;
                }

                .table-dark-custom td:first-child::before { display: none; }
            }
        </style>
    </head>

    <div layout:fragment="content">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h4 class="fw-bold mb-0 text-white">Catálogo de Productos</h4>
                <p class="text-muted small mb-0">Gestión de inventario y servicios.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/productos/importar-view}" class="btn btn-sm btn-outline-light px-3 fw-bold border-slate-700">
                    <i class="bi bi-file-earmark-arrow-up"></i> <span class="d-none d-sm-inline ms-1">Importar</span>
                </a>
                <a th:href="@{/productos/nuevo}" class="btn btn-sm btn-success px-3 fw-bold shadow-lg">
                    <i class="bi bi-plus-lg"></i> <span class="d-none d-sm-inline ms-1">Nuevo Ítem</span>
                </a>
            </div>
        </div>

        <div class="card p-2 p-md-3 mb-4 shadow-sm" style="background: var(--pf-card-bg); border: 1px solid var(--pf-border); border-radius: 16px;">
            <div class="row g-2">
                <div class="col-md-9 position-relative">
                    <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="busqueda" class="form-control form-control-dark py-2 ps-5"
                           placeholder="Buscar por nombre o código..." oninput="cambiarPagina(0)">
                </div>
                <div class="col-md-3">
                    <select class="form-select form-control-dark py-2" id="filtroTipo" onchange="cambiarPagina(0)">
                        <option value="">Todos los tipos</option>
                        <option value="1">Producto</option>
                        <option value="2">Servicio</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="contenedor-dinamico" th:fragment="lista_completa">
            <div class="table-dark-custom shadow-xl mb-4">
                <div>
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th class="ps-3 ps-md-4">Ítem</th>
                            <th class="text-center col-clasificacion">Clasificación</th>
                            <th class="text-center">Precio</th>
                            <th class="text-center pe-3 pe-md-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody id="tabla-resultados">
                        <tr th:each="p : ${productos}">
                            <td class="ps-3 ps-md-4" data-label="Ítem">
                                <div>
                                    <div class="d-flex align-items-center gap-2">
                                        <i th:if="${p.esFavorito == 1}" class="bi bi-star-fill text-warning" style="font-size: 0.7rem;"></i>
                                        <span class="fw-bold text-white item-name lh-sm" th:text="${p.nombre}"></span>
                                    </div>
                                    <div class="text-muted text-start" style="font-size: 0.75rem;">
                                        <span th:text="${p.familia?.nombre} ?: 'General'"></span>
                                        <span class="d-md-none"> • </span>
                                        <span class="d-md-none text-primary" th:text="${p.idTipoProducto == 1 ? 'Producto' : 'Servicio'}"></span>
                                    </div>
                                </div>
                            </td>
                            <td class="text-center col-clasificacion" data-label="Tipo">
                                <span th:if="${p.idTipoProducto == 1}" class="badge rounded-pill bg-primary-subtle text-primary border border-primary-subtle px-2 py-1" style="font-size: 0.65rem;">Producto</span>
                                <span th:if="${p.idTipoProducto == 2}" class="badge rounded-pill bg-info-subtle text-info border border-info-subtle px-2 py-1" style="font-size: 0.65rem;">Servicio</span>
                            </td>
                            <td class="text-center fw-bold text-success" data-label="Precio">
                                $[[${#numbers.formatDecimal(p.precio != null ? p.precio : 0, 1, 2)}]]
                            </td>
                            <td class="text-center pe-3 pe-md-4" data-label="Acciones">
                                <div class="d-flex justify-content-end justify-content-md-center gap-2">
                                    <a th:href="@{/productos/editar/{id}(id=${p.idProducto})}" class="btn btn-sm btn-outline-light border-slate-700">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button class="btn btn-sm btn-outline-danger" th:onclick="'anularProducto(' + ${p.idProducto} + ')'">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="4" class="text-center py-5 text-muted">No se encontraron resultados</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="pagination-container d-flex justify-content-between align-items-center" id="contenedor-paginacion">
                <div class="text-muted small">
                    <span class="d-none d-md-inline">Mostrando </span>
                    <span class="text-white fw-bold" th:text="${productos.size()}">0</span> ítems
                </div>
                <div class="d-flex gap-1" th:if="${totalPaginas > 1}">
                    <button class="page-link-custom" th:disabled="${paginaActual == 0}"
                            th:onclick="'cambiarPagina(' + (${paginaActual} - 1) + ')'">
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <button th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
                            th:text="${i + 1}"
                            th:classappend="${i == paginaActual} ? 'active' : ''"
                            class="page-link-custom"
                            th:onclick="'cambiarPagina(' + ${i} + ')'">
                    </button>

                    <button class="page-link-custom" th:disabled="${paginaActual + 1 >= totalPaginas}"
                            th:onclick="'cambiarPagina(' + (${paginaActual} + 1) + ')'">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
    </th:block>
</th:block>
