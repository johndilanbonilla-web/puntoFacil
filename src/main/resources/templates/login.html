<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login | Punto Fácil</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --accent-green: #22c55e;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
            --input-border: #334155;
            --error-red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background-color: var(--card-dark);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .brand { font-weight: 800; font-size: 2.2rem; letter-spacing: -0.05em; }
        .brand span { color: var(--accent-green); }

        /* --- NUEVO: ESTILO PARA LA ALERTA DE ERROR --- */
        .alert-error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--error-red);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .input-group-custom { position: relative; margin-bottom: 1.5rem; }
        .input-group-custom i {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            color: #64748b; font-size: 1.2rem; z-index: 10;
        }

        .input-group-custom .form-control {
            background-color: var(--input-bg) !important;
            border: 2px solid var(--input-border);
            color: white !important;
            padding: 14px 14px 14px 48px;
            border-radius: 14px;
        }

        .form-control::placeholder { color: #64748b !important; }

        .btn-login {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white; width: 100%; padding: 15px; border-radius: 14px;
            border: none; font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.3);
            transition: all 0.3s ease;
        }

        .btn-login:hover { transform: translateY(-2px); filter: brightness(1.1); }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">

        <div class="text-center mb-5">
            <h2 class="brand">
                <i class="bi bi-receipt-cutoff text-success"></i>
                Punto<span>Fácil</span>
            </h2>
            <p class="subtitle mt-2 text-muted">Accede a tu panel de control</p>
        </div>

        <form th:action="@{/login}" method="post" id="loginForm">

            <div th:if="${param.error}" class="alert-error">
                <i class="bi bi-exclamation-circle-fill"></i>
                <span>Usuario o contraseña incorrectos</span>
            </div>

            <div th:if="${param.logout}" class="alert-error" style="color: var(--accent-green); background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.2);">
                <i class="bi bi-check-circle-fill"></i>
                <span>Sesión cerrada correctamente</span>
            </div>

            <div class="input-group-custom">
                <i class="bi bi-person"></i>
                <input type="text" name="username" class="form-control"
                       placeholder="Usuario o Correo" required autofocus>
            </div>

            <div class="input-group-custom">
                <i class="bi bi-lock"></i>
                <input type="password" name="password" id="password"
                       class="form-control" placeholder="Tu contraseña" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">
                <span id="btnText">Entrar al Sistema <i class="bi bi-chevron-right ms-1"></i></span>
            </button>

        </form>

        <div class="text-center mt-4 copyright text-muted" style="font-size: 0.8rem;">
            © 2026 PUNTO FÁCIL POS · V2.0
        </div>

    </div>
</div>

<script>
    // Pequeño script para evitar doble clic y dar feedback visual
    document.getElementById('loginForm').onsubmit = function() {
        const btn = document.getElementById('submitBtn');
        const text = document.getElementById('btnText');
        btn.disabled = true;
        text.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Validando...';
    };
</script>

</body>
</html>
